name: Extract Easy2Excel ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q easy-to-excel-clear-mvp.zip -d extracted

          if [ "$(find extracted -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && [ -d "$(find extracted -mindepth 1 -maxdepth 1 -type d)" ]; then
            rsync -a "$(find extracted -mindepth 1 -maxdepth 1 -type d)/" ./
          else
            rsync -a extracted/ ./
          fi

          rm -rf extracted easy-to-excel-clear-mvp.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Easy2Excel project files" || echo "Nothing to commit"
          git push
